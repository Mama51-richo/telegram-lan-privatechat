<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR & Barcode Reader · Product Lookup</title>
    <!-- Include QuaggaJS for barcode scanning (supports QR, EAN, UPC, etc.) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b1a2f;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            max-width: 640px;
            width: 100%;
            background: #f8faff;
            border-radius: 40px;
            padding: 24px 24px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: 0.25s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0a1e32;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #2a4b6e;
            margin-left: auto;
            background: #dce6f2;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .scanner-box {
            background: #111d2b;
            border-radius: 28px;
            padding: 12px;
            margin: 12px 0 16px;
            position: relative;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
        }
        #scanner-container {
            width: 100%;
            aspect-ratio: 1/0.9;
            background: #1a2a3a;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            min-height: 240px;
        }
        #scanner-container video, 
        #scanner-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }
        #scanner-container .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8aa3c0;
            height: 100%;
            font-weight: 400;
            background: #142433;
            text-align: center;
            padding: 20px;
        }
        .placeholder span {
            font-size: 3.2rem;
            margin-bottom: 8px;
            opacity: 0.6;
        }
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 16px 0 8px;
        }
        .btn {
            background: #eef3fc;
            border: none;
            padding: 12px 22px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: #0b1a2f;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            flex: 1 1 auto;
            justify-content: center;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: #1e4b6e;
            color: white;
            box-shadow: 0 6px 12px rgba(20, 60, 100, 0.3);
        }
        .btn-primary:hover { background: #123a57; }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
        .btn-outline {
            background: transparent;
            border: 1px solid #2d4b6b;
            color: #1e3b57;
        }
        .btn-outline:hover { background: #dce6f2; }
        .result-panel {
            margin-top: 22px;
            background: #eaf1fb;
            border-radius: 28px;
            padding: 20px 22px;
            border-left: 6px solid #1f6390;
        }
        .result-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2f577b;
            font-weight: 600;
        }
        #product-name {
            font-size: 1.9rem;
            font-weight: 700;
            color: #03101e;
            line-height: 1.2;
            margin: 6px 0 4px;
            word-break: break-word;
        }
        #product-details {
            color: #1b3855;
            font-size: 1rem;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
        }
        .detail-badge {
            background: #d2e1f5;
            padding: 4px 14px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #07273f;
        }
        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            border-top: 1px solid #c8d9ee;
            padding-top: 14px;
            font-size: 0.9rem;
            color: #1f3f5a;
        }
        .code-value {
            background: #ffffffb0;
            padding: 4px 14px;
            border-radius: 60px;
            font-family: 'Courier New', monospace;
            font-weight: 500;
            letter-spacing: 0.3px;
            font-size: 0.9rem;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status-badge {
            background: #1f6390;
            color: white;
            padding: 2px 16px;
            border-radius: 60px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .footnote {
            margin-top: 14px;
            color: #3d5f7e;
            font-size: 0.85rem;
            text-align: center;
            border-top: 1px solid #cddef2;
            padding-top: 14px;
        }
        #short-answer {
            background: #0b1a2f10;
            border-radius: 60px;
            padding: 8px 18px;
            font-weight: 500;
            display: inline-block;
            margin-top: 6px;
            color: #04243b;
            border: 1px dashed #1f639080;
        }
        @media (max-width: 480px) {
            .card { padding: 16px; }
            #product-name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>
            📷 Scan & Identify
            <small>QR · Barcode</small>
        </h1>

        <div class="scanner-box">
            <div id="scanner-container">
                <div class="placeholder" id="placeholder-message">
                    <span>📸</span>
                    <p>Press "Start Camera" to scan<br>QR / EAN / UPC / Code128 …</p>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startScannerBtn">▶ Start Camera</button>
            <button class="btn btn-outline" id="stopScannerBtn">⏹ Stop</button>
        </div>

        <!-- Result panel -->
        <div class="result-panel" id="resultPanel">
            <div class="result-label">📦 Product Info</div>
            <div id="product-name">—</div>
            <div id="product-details">
                <span class="detail-badge">🔍 waiting for scan</span>
            </div>
            <div class="meta-row">
                <span class="code-value" id="decodedCode">—</span>
                <span class="status-badge" id="scanStatus">idle</span>
            </div>
            <!-- First short answer: shows quick summary -->
            <div id="short-answer">⚡ short answer: scan a code</div>
        </div>
        <div class="footnote">
            <span>📌 Supports QR, EAN-13, UPC-A, Code128, Code39, etc.</span>
        </div>
    </div>

    <script>
        (function() {
            // ---- DOM refs ----
            const container = document.getElementById('scanner-container');
            const placeholder = document.getElementById('placeholder-message');
            const startBtn = document.getElementById('startScannerBtn');
            const stopBtn = document.getElementById('stopScannerBtn');
            const productNameEl = document.getElementById('product-name');
            const productDetailsEl = document.getElementById('product-details');
            const decodedCodeEl = document.getElementById('decodedCode');
            const scanStatusEl = document.getElementById('scanStatus');
            const shortAnswerEl = document.getElementById('short-answer');

            let scannerActive = false;
            let quaggaInitialized = false;

            // ---- Mock product database (simulate real lookup) ----
            // In a real app, you would call an API like Open Food Facts, etc.
            function lookupProduct(code) {
                // Clean code: remove common prefix/suffix for better matching
                const clean = code.replace(/^[^0-9A-Za-z]+/, '').trim();
                
                // Mock dataset (first few examples)
                const mockDB = {
                    '9780201379624': { name: 'The Pragmatic Programmer', details: 'Andrew Hunt, David Thomas · 2000', short: 'Classic dev book' },
                    '9780131103627': { name: 'The C Programming Language', details: 'Kernighan & Ritchie · 1988', short: 'K&R C bible' },
                    '5901234123457': { name: 'Fake Product (test EAN)', details: 'Test EAN-13 · sample', short: 'Test barcode' },
                    '123456789012': { name: 'Demo QR Code', details: 'Custom QR · demo data', short: 'QR test' },
                    '5053990174202': { name: 'Fanta Lemon', details: 'Soft drink, 330ml', short: 'Fanta lemon' },
                    '2000000000000': { name: 'Sample UPC', details: 'UPC-A test product', short: 'UPC sample' },
                    '4006381333931': { name: 'Nutella', details: 'Ferrero, 400g', short: 'Nutella jar' },
                    '7311180000000': { name: 'IKEA Blue Bag', details: 'FRAKTA, 70L', short: 'IKEA bag' },
                    'https://example.com': { name: 'Example QR (URL)', details: 'Link: example.com', short: 'URL: example.com' },
                };

                // Try exact match, then fallback to partial match (first 8 chars etc.)
                let entry = mockDB[clean] || mockDB[code];
                if (!entry) {
                    // try partial matching for longer codes (like QR with embedded text)
                    for (const [key, val] of Object.entries(mockDB)) {
                        if (code.includes(key) || key.includes(code)) {
                            entry = val;
                            break;
                        }
                    }
                }

                if (entry) {
                    return {
                        name: entry.name,
                        details: entry.details || 'Product found in mock DB',
                        short: entry.short || `${entry.name} (scanned)`
                    };
                } else {
                    // fallback: generate smart placeholder
                    let shortSummary = `Code: ${code.slice(0,12)}${code.length>12?'…':''}`;
                    return {
                        name: `📋 ${code.slice(0, 16)}${code.length>16?'…':''}`,
                        details: `Barcode/QR · format: ${detectFormat(code)}`,
                        short: shortSummary
                    };
                }
            }

            // helper to guess format (just for display)
            function detectFormat(code) {
                if (/^\d{13}$/.test(code)) return 'EAN-13';
                if (/^\d{12}$/.test(code)) return 'UPC-A';
                if (/^\d{8}$/.test(code)) return 'EAN-8';
                if (/^[A-Z0-9\-_]+$/.test(code) && code.length > 6) return 'QR / Code128';
                return 'auto';
            }

            // ---- Update UI with product data ----
            function displayProductData(code) {
                const product = lookupProduct(code);
                productNameEl.textContent = product.name || 'Unknown item';
                // details: show extra info
                productDetailsEl.innerHTML = `
                    <span class="detail-badge">${product.details || 'no details'}</span>
                    <span class="detail-badge">${detectFormat(code)}</span>
                `;
                decodedCodeEl.textContent = code;
                scanStatusEl.textContent = '✅ scanned';
                scanStatusEl.style.background = '#1f8b4c';
                // First short answer: product short description
                shortAnswerEl.innerHTML = `⚡ ${product.short || 'product identified'}`;
            }

            // ---- Quagga onDetected callback ----
            function onCodeDetected(result) {
                if (!scannerActive) return;
                const code = result.codeResult.code;
                if (code) {
                    displayProductData(code);
                    // Optionally pause scanning after first detection? we keep continuous.
                    // but we set a flag to avoid flooding.
                }
            }

            // ---- Initialize Quagga ----
            function initQuagga() {
                if (quaggaInitialized) {
                    // if already initialized, just restart
                    Quagga.stop();
                    Quagga.start();
                    return;
                }

                Quagga.init({
                    inputStream: {
                        name: "Live",
                        type: "LiveStream",
                        target: container,
                        constraints: {
                            facingMode: "environment",
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                        },
                    },
                    decoder: {
                        readers: [
                            "code_128_reader",
                            "ean_reader",
                            "ean_8_reader",
                            "upc_reader",
                            "code_39_reader",
                            "code_93_reader",
                            "codabar_reader",
                            "qr_reader"  // QR support
                        ],
                        multiple: false,
                    },
                    locate: true,
                }, function(err) {
                    if (err) {
                        console.error("Quagga init error:", err);
                        scanStatusEl.textContent = '⚠️ camera error';
                        scanStatusEl.style.background = '#a13d3d';
                        shortAnswerEl.innerHTML = '⚠️ Could not access camera. Check permissions.';
                        return;
                    }
                    quaggaInitialized = true;
                    Quagga.start();
                    scannerActive = true;
                    updateUIForActiveScan(true);
                    // remove placeholder
                    if (placeholder) placeholder.style.display = 'none';
                    scanStatusEl.textContent = '📷 scanning...';
                    scanStatusEl.style.background = '#1f6390';
                });

                Quagga.onDetected(onCodeDetected);
            }

            // ---- UI helpers ----
            function updateUIForActiveScan(active) {
                startBtn.disabled = active;
                if (active) {
                    startBtn.textContent = '⏳ Scanning';
                    startBtn.style.opacity = '0.7';
                } else {
                    startBtn.textContent = '▶ Start Camera';
                    startBtn.style.opacity = '1';
                }
            }

            // ---- Start scanner ----
            function startScanner() {
                if (scannerActive) {
                    // if already active, maybe restart
                    Quagga.stop();
                    Quagga.start();
                    return;
                }
                // If placeholder visible, remove
                if (placeholder) placeholder.style.display = 'none';
                initQuagga();
            }

            // ---- Stop scanner ----
            function stopScanner() {
                if (quaggaInitialized) {
                    Quagga.stop();
                    scannerActive = false;
                    updateUIForActiveScan(false);
                    scanStatusEl.textContent = '⏸ stopped';
                    scanStatusEl.style.background = '#5f6f7e';
                    // show placeholder again
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `<span>📷</span><p>Camera stopped</p>`;
                    }
                    // reset product display? we keep last result
                    // but we can show idle
                    if (!document.getElementById('product-name').textContent.trim() || document.getElementById('product-name').textContent === '—') {
                        // keep as is
                    }
                } else {
                    // if not initialized, just reset UI
                    scannerActive = false;
                    updateUIForActiveScan(false);
                    scanStatusEl.textContent = 'idle';
                    scanStatusEl.style.background = '#5f6f7e';
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `<span>📸</span><p>Press "Start Camera" to scan</p>`;
                    }
                }
            }

            // ---- attach events ----
            startBtn.addEventListener('click', startScanner);
            stopBtn.addEventListener('click', stopScanner);

            // ---- On page load, show placeholder ----
            // reset UI
            stopScanner(); // ensures clean state

            // ---- if user wants to test without camera (demo fallback) ----
            // Pressing "Start" will request camera, but we also add a hidden demo:
            // double click on result panel to manually set a test QR
            const resultPanel = document.getElementById('resultPanel');
            resultPanel.addEventListener('dblclick', function(e) {
                // demo: set a sample product
                const demoCode = '9780201379624'; // Pragmatic Programmer
                displayProductData(demoCode);
                shortAnswerEl.innerHTML = '⚡ (demo) The Pragmatic Programmer';
                scanStatusEl.textContent = '📋 demo';
                scanStatusEl.style.background = '#b17d3a';
            });

            // also if scanning fails, we keep ui friendly
            console.log('📲 Barcode/QR reader ready. Double-click result panel to load demo.');
        })();
    </script>
</body>
</html>
