<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🔇 Sound Level Guardian · kill noise</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #0b1a2e, #030811);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      margin: 0;
      color: #eaf0fa;
    }
    .app-shell {
      max-width: 700px;
      width: 100%;
      background: rgba(18, 28, 46, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 42px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
      padding: 24px 20px 30px;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    .subtitle {
      font-size: 0.9rem;
      color: #a7bdd6;
      margin-bottom: 22px;
      background: rgba(255,255,255,0.05);
      display: inline-block;
      border-radius: 40px;
      padding: 6px 18px;
      font-weight: 400;
    }
    .monitor-panel {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 34px;
      padding: 18px 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    .level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }
    .sound-bar-container {
      flex: 3;
      min-width: 180px;
    }
    .sound-bar-bg {
      background: #1f2b3c;
      height: 24px;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: inset 0 2px 6px #00000070;
    }
    .sound-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
      border-radius: 30px;
      transition: width 0.08s linear;
    }
    .decibel-readout {
      font-weight: 700;
      font-size: 1.7rem;
      background: #0e1622;
      padding: 8px 20px;
      border-radius: 40px;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      min-width: 100px;
      text-align: center;
      color: #ffffff;
    }
    .threshold-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 30px;
      padding: 8px 16px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .threshold-control label {
      font-weight: 600;
      color: #b7c9e0;
      font-size: 0.9rem;
    }
    .threshold-control input {
      width: 90px;
      font-weight: 700;
      background: #0e1a2b;
      color: white;
      border: 1px solid #3b516d;
      border-radius: 30px;
      padding: 10px 8px;
      text-align: center;
      font-size: 1rem;
      outline: none;
    }
    .toggle-btn {
      background: #2c3e57;
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 6px 14px rgba(0,0,0,0.4);
      letter-spacing: 0.3px;
      border: 1px solid #ffffff30;
    }
    .toggle-btn.active {
      background: #b91c1c;
      box-shadow: 0 0 16px #ef4444a0;
    }
    .alert-badge {
      background: #dc2626;
      color: white;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 40px;
      display: inline-block;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      animation: pulse 1s infinite;
      box-shadow: 0 0 18px #ef4444;
    }
    @keyframes pulse {
      0% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.02); }
      100% { opacity: 0.9; transform: scale(1); }
    }
    .action-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0 18px;
    }
    .btn {
      background: #1d2f44;
      border: none;
      color: #f0f6ff;
      font-weight: 600;
      padding: 13px 22px;
      border-radius: 38px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #ffffff30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 14px rgba(0, 0, 0, 0.5);
      flex: 1 1 160px;
      justify-content: center;
    }
    .btn:hover {
      background: #2b4261;
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.6);
    }
    .btn-kill {
      background: #991b1b;
      border-color: #ef4444a0;
    }
    .btn-kill:hover {
      background: #b91c1c;
    }
    .log-area {
      background: #0a121f;
      border-radius: 24px;
      padding: 14px 18px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
      font-size: 0.85rem;
      border: 1px solid #2f4058;
    }
    .log-entry {
      display: flex;
      justify-content: space-between;
      padding: 6px 4px;
      border-bottom: 1px solid #1f2e42;
      color: #cbd5e1;
    }
    .log-entry.warning {
      color: #fecaca;
      font-weight: 600;
    }
    .soundscape-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #152238;
      border-radius: 30px;
      padding: 8px 18px;
      margin-top: 14px;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #3b4f6b;
    }
    .soundscape-toggle input {
      width: 20px;
      height: 20px;
      accent-color: #22c55e;
    }
    hr {
      border: 0.5px solid #2f4058;
      margin: 18px 0 6px;
    }
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #22c55e;
      border-radius: 20px;
      margin-right: 6px;
      box-shadow: 0 0 8px #22c55e;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <h1>🔇 Sound Guardian</h1>
  <div class="subtitle">📱 kill loud noise · monitor & alert</div>

  <!-- Live monitor -->
  <div class="monitor-panel">
    <div class="level-row">
      <div class="sound-bar-container">
        <div class="sound-bar-bg">
          <div class="sound-bar-fill" id="soundBarFill" style="width:0%"></div>
        </div>
      </div>
      <div class="decibel-readout" id="dbReadout">-∞ dB</div>
    </div>
    <div class="threshold-control">
      <label>🔊 Alert threshold:</label>
      <input type="number" id="thresholdInput" min="40" max="120" step="1" value="85" />
      <span style="font-weight:600;">dB</span>
    </div>
    <div id="alertIndicator" style="margin-top:12px; min-height:32px;"></div>
  </div>

  <!-- Actions -->
  <div class="action-grid">
    <button class="btn btn-kill" id="killSoundBtn">🔇 MUTE OUTPUT</button>
    <button class="btn" id="simulateLoudBtn">📢 Simulate loud</button>
    <button class="btn" id="resetAlertBtn">🔄 Reset</button>
  </div>

  <!-- Soundscape -->
  <div class="soundscape-toggle">
    <input type="checkbox" id="soundscapeCheckbox" />
    <label for="soundscapeCheckbox" style="font-weight:500;">🎵 Play calming soundscape (white noise)</label>
  </div>

  <!-- Log -->
  <hr />
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span style="font-weight:600;">📋 Alert log</span>
    <span id="logCount" style="background:#1e2d42; padding:4px 12px; border-radius:20px;">0</span>
  </div>
  <div class="log-area" id="logContainer">
    <div style="color:#64748b; text-align:center;">— monitoring ready —</div>
  </div>
</div>

<script>
  (function() {
    // ---------- STATE ----------
    let isMuted = false;             // "kill sound" manual mute (visual + audio gain)
    let threshold = 85;              // dB alert threshold
    let currentDb = -Infinity;       // measured volume (approximated from mic)
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let stream = null;
    let isListening = false;
    let soundscapeGain = null;
    let soundscapeActive = false;
    let audioBufferForNoise = null;
    let noiseSource = null;
    let alertLogs = [];
    
    // DOM elements
    const dbReadout = document.getElementById('dbReadout');
    const soundBarFill = document.getElementById('soundBarFill');
    const thresholdInput = document.getElementById('thresholdInput');
    const alertIndicator = document.getElementById('alertIndicator');
    const killSoundBtn = document.getElementById('killSoundBtn');
    const simulateLoudBtn = document.getElementById('simulateLoudBtn');
    const resetAlertBtn = document.getElementById('resetAlertBtn');
    const soundscapeCheckbox = document.getElementById('soundscapeCheckbox');
    const logContainer = document.getElementById('logContainer');
    const logCount = document.getElementById('logCount');

    // ---------- Microphone & analyser setup ----------
    async function initAudioMonitoring() {
      if (isListening) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        await audioContext.resume();
        microphone = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.75;
        microphone.connect(analyser);
        isListening = true;
        startVolumeLoop();
        addLog('🎤 Microphone active', false);
      } catch (err) {
        console.warn('Microphone access denied or unavailable.', err);
        alertIndicator.innerHTML = `<span style="color:#fbbf24;">⚠️ Microphone unavailable — using simulation mode.</span>`;
        // fallback simulation loop for testing without mic
        startSimulatedMonitoring();
      }
    }

    // Fallback simulated volume (for testing on devices without mic)
    function startSimulatedMonitoring() {
      if (isListening) return;
      isListening = true;
      setInterval(() => {
        if (!isListening) return;
        // simulate background noise 30-90 dB
        const simulatedDb = 40 + Math.random() * 35;
        updateVolume(simulatedDb);
      }, 300);
      addLog('⚙️ Simulation mode (no mic)', false);
    }

    // Main volume loop using analyser
    function startVolumeLoop() {
      const update = () => {
        if (!isListening) return;
        if (analyser && !isMuted) {
          const dataArray = new Uint8Array(analyser.fftSize);
          analyser.getByteTimeDomainData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            const val = (dataArray[i] - 128) / 128;
            sum += val * val;
          }
          const rms = Math.sqrt(sum / dataArray.length);
          // Map RMS to dB approximation (0 .. ~100 dB)
          let db = Math.round(20 * Math.log10(rms + 0.0001) + 90);
          if (db < 20) db = 20;
          if (db > 110) db = 110;
          updateVolume(db);
        }
        requestAnimationFrame(update);
      };
      requestAnimationFrame(update);
    }

    // Update UI with current volume, check threshold
    function updateVolume(db) {
      currentDb = db;
      const displayDb = isFinite(db) ? db : 0;
      dbReadout.textContent = `${Math.max(0, Math.round(displayDb))} dB`;
      const percent = Math.min(100, Math.max(0, ((displayDb - 20) / (110 - 20)) * 100));
      soundBarFill.style.width = percent + '%';
      
      if (displayDb >= threshold && !isMuted) {
        showAlert(displayDb);
      } else {
        alertIndicator.innerHTML = `<span style="color:#a7bdd6;"><span class="status-dot"></span>Normal level</span>`;
      }
    }

    // Alert trigger
    function showAlert(db) {
      alertIndicator.innerHTML = `<span class="alert-badge">🔔 NOISE ALERT! ${Math.round(db)} dB exceeds ${threshold} dB</span>`;
      addLog(`⚠️ Loud noise detected: ${Math.round(db)} dB`, true);
      // optional haptic feedback if supported
      if (navigator.vibrate) navigator.vibrate(200);
    }

    // Add log entry
    function addLog(message, isWarning = false) {
      const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entryDiv = document.createElement('div');
      entryDiv.className = `log-entry ${isWarning ? 'warning' : ''}`;
      entryDiv.innerHTML = `<span>${timestamp}</span><span>${message}</span>`;
      logContainer.prepend(entryDiv);
      alertLogs.push({ timestamp, message, isWarning });
      logCount.textContent = alertLogs.length;
      // keep log area manageable
      if (logContainer.children.length > 30) {
        logContainer.removeChild(logContainer.lastChild);
      }
    }

    // Manual mute / kill sound (simulates blocking output)
    function toggleKillSound() {
      isMuted = !isMuted;
      if (isMuted) {
        killSoundBtn.textContent = '🔇 MUTED (click to unmute)';
        killSoundBtn.style.background = '#7f1d1d';
        addLog('🔇 Sound output killed (visual mute)', false);
        alertIndicator.innerHTML = `<span style="color:#fbbf24;">⛔ Muted — all audio ignored</span>`;
        if (audioContext && microphone) {
          // Disconnect microphone from analyser to stop reading? We keep monitoring but visually muted.
          // Actual kill output: we can't stop physical speaker, but we simulate silence.
          if (soundscapeGain) soundscapeGain.gain.value = 0;
        }
      } else {
        killSoundBtn.textContent = '🔇 MUTE OUTPUT';
        killSoundBtn.style.background = '#991b1b';
        addLog('🔊 Sound unmuted', false);
        if (soundscapeGain && soundscapeActive) soundscapeGain.gain.value = 0.6;
      }
    }

    // Simulate loud event (for testing)
    function simulateLoud() {
      const simulatedDb = 92 + Math.random() * 18; // 92-110 dB
      updateVolume(simulatedDb);
      if (simulatedDb >= threshold) showAlert(simulatedDb);
      addLog(`📢 Simulated loud: ${Math.round(simulatedDb)} dB`, true);
    }

    // Reset threshold & clear alerts
    function resetAlerts() {
      threshold = parseInt(thresholdInput.value) || 85;
      alertLogs = [];
      logContainer.innerHTML = `<div style="color:#64748b; text-align:center;">— log cleared —</div>`;
      logCount.textContent = '0';
      alertIndicator.innerHTML = `<span style="color:#a7bdd6;">✨ Reset complete</span>`;
      if (!isMuted) {
        isMuted = false;
        killSoundBtn.textContent = '🔇 MUTE OUTPUT';
      }
      addLog('🔄 Reset threshold & logs', false);
    }

    // Soundscape white noise generator
    function toggleSoundscape() {
      soundscapeActive = soundscapeCheckbox.checked;
      if (soundscapeActive) {
        startSoundscape();
        addLog('🎵 Calming soundscape ON', false);
      } else {
        stopSoundscape();
        addLog('🎵 Soundscape OFF', false);
      }
    }

    function startSoundscape() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (!audioBufferForNoise) {
        const bufferSize = 2 * audioContext.sampleRate;
        audioBufferForNoise = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = audioBufferForNoise.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }
      if (!noiseSource) {
        noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = audioBufferForNoise;
        noiseSource.loop = true;
        soundscapeGain = audioContext.createGain();
        soundscapeGain.gain.value = 0.6;
        noiseSource.connect(soundscapeGain);
        soundscapeGain.connect(audioContext.destination);
        noiseSource.start();
      } else {
        if (soundscapeGain) soundscapeGain.gain.value = 0.6;
      }
    }

    function stopSoundscape() {
      if (soundscapeGain) {
        soundscapeGain.gain.value = 0;
      }
      if (noiseSource) {
        try { noiseSource.stop(); } catch(e) {}
        noiseSource.disconnect();
        noiseSource = null;
        soundscapeGain = null;
      }
    }

    // ---------- Event listeners ----------
    thresholdInput.addEventListener('change', function() {
      let val = parseInt(this.value);
      if (isNaN(val)) val = 85;
      val = Math.min(120, Math.max(40, val));
      this.value = val;
      threshold = val;
      addLog(`🔔 Threshold set to ${threshold} dB`, false);
    });

    killSoundBtn.addEventListener('click', toggleKillSound);
    simulateLoudBtn.addEventListener('click', simulateLoud);
    resetAlertBtn.addEventListener('click', resetAlerts);
    soundscapeCheckbox.addEventListener('change', toggleSoundscape);

    // Initialize microphone on first interaction (browser policy)
    window.addEventListener('load', () => {
      // attempt microphone after a short delay or click gesture
      document.body.addEventListener('click', function initAudioOnFirstClick() {
        if (!isListening) {
          initAudioMonitoring();
        }
        document.body.removeEventListener('click', initAudioOnFirstClick);
      }, { once: true });

      // also try immediately (may fail if not allowed)
      setTimeout(() => {
        if (!isListening) {
          initAudioMonitoring().catch(() => {});
        }
      }, 500);
    });

    // initial threshold value
    threshold = parseInt(thresholdInput.value) || 85;
    addLog('🔔 Threshold: 85 dB · tap to enable mic', false);
  })();
</script>
</body>
</html>
