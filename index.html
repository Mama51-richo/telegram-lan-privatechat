<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🔢 Decision Matrix · weigh options</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(145deg, #f5f7fa 0%, #e9edf5 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      margin: 0;
    }
    .app-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 36px;
      box-shadow: 0 25px 45px rgba(0, 10, 30, 0.18), 0 6px 12px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 28px;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    h1 {
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: #0a1e3c;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 0 6px;
    }
    .subhead {
      font-size: 0.95rem;
      color: #3c4e6b;
      margin-bottom: 24px;
      padding: 0 8px;
      font-weight: 400;
      background: rgba(255, 255, 255, 0.4);
      display: inline-block;
      border-radius: 40px;
      padding: 6px 16px;
    }
    .control-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 24px;
      align-items: center;
      justify-content: space-between;
    }
    .field-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      padding: 8px 16px;
      border-radius: 40px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
      flex: 1 1 200px;
    }
    .field-group label {
      font-weight: 600;
      color: #1f3a5f;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .field-group input {
      border: none;
      background: transparent;
      padding: 8px 4px;
      font-size: 1rem;
      flex: 1;
      min-width: 50px;
      outline: none;
      font-weight: 500;
      color: #0b1f38;
    }
    .field-group input::placeholder {
      color: #9aaec9;
      font-weight: 400;
      opacity: 0.7;
    }
    .btn {
      background: #0a1e3c;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 40px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 6px 14px rgba(10, 30, 60, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
      border: 1px solid #ffffff40;
    }
    .btn:hover {
      background: #1c3c6e;
      transform: scale(1.02);
      box-shadow: 0 10px 18px rgba(10, 30, 60, 0.3);
    }
    .btn-outline {
      background: #ffffffd9;
      color: #0a1e3c;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      border: 1px solid #cbd5e1;
    }
    .btn-outline:hover {
      background: #ffffff;
      color: #0a1e3c;
    }
    .section-title {
      font-weight: 600;
      font-size: 1.2rem;
      color: #152b4e;
      margin: 20px 0 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 12px 0 18px;
    }
    .option-item {
      background: white;
      border-radius: 28px;
      padding: 6px 14px 6px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid #eef2f7;
      transition: 0.1s;
    }
    .option-item input[type="text"] {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 1rem;
      padding: 10px 0;
      outline: none;
      font-weight: 500;
      color: #1f2937;
      min-width: 40px;
    }
    .option-item .weight-input {
      width: 68px;
      text-align: center;
      font-weight: 600;
      background: #f8fafc;
      border-radius: 30px;
      padding: 8px 6px;
      border: 1px solid #dce3ec;
      outline: none;
    }
    .remove-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: #b91c1c;
      padding: 6px 8px;
      border-radius: 40px;
      transition: 0.1s;
      line-height: 1;
      font-weight: 500;
    }
    .remove-btn:hover {
      background: #fee2e2;
      color: #991b1b;
    }
    .score-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
    }
    .score-box {
      background: #ffffffdb;
      border-radius: 24px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 180px;
      border: 1px solid #e1e8f0;
      backdrop-filter: blur(4px);
    }
    .score-box input {
      width: 70px;
      font-weight: 700;
      text-align: center;
      border: 1px solid #cfddee;
      background: white;
      border-radius: 30px;
      padding: 8px 6px;
      font-size: 0.95rem;
    }
    .result-panel {
      margin-top: 26px;
      background: #0f2547;
      border-radius: 36px;
      padding: 18px 22px;
      color: white;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.2);
    }
    .result-title {
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 12px;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rank-item {
      background: rgba(255, 255, 255, 0.07);
      border-radius: 30px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.15);
      font-weight: 500;
      backdrop-filter: blur(2px);
    }
    .rank-name {
      font-size: 1rem;
      letter-spacing: 0.2px;
    }
    .rank-score {
      font-weight: 700;
      background: #1f4b8a;
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 0.9rem;
    }
    .rank-badge {
      background: #facc15;
      color: #0a1e3c;
      font-weight: 800;
      border-radius: 40px;
      padding: 2px 12px;
      font-size: 0.75rem;
      margin-left: 8px;
    }
    .empty-msg {
      text-align: center;
      color: #4b5c7a;
      padding: 12px;
      font-style: italic;
    }
    .action-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
      justify-content: flex-start;
    }
    hr {
      margin: 18px 0 6px;
      border: 0.5px solid #d0dae8;
    }
  </style>
</head>
<body>
<div class="app-card">
  <h1>⚖️ Decision Matrix</h1>
  <div class="subhead">📱 Score your options · fully functional</div>

  <!-- Add option & weight -->
  <div class="control-grid">
    <div class="field-group">
      <label>➕ Option</label>
      <input type="text" id="newOptionName" placeholder="e.g. Tokyo" value="Kyoto" />
    </div>
    <div class="field-group">
      <label>⚖️ Weight</label>
      <input type="number" id="newOptionWeight" min="1" max="10" step="0.5" value="5" />
    </div>
    <button class="btn" id="addOptionBtn">➕ Add</button>
  </div>

  <!-- Option list -->
  <div class="section-title">
    <span>📋 Options & weights</span>
    <span style="font-size:0.8rem; background:#e2e8f0; padding:4px 10px; border-radius:30px;">weight 1–10</span>
  </div>
  <div id="optionsContainer" class="option-list">
    <!-- dynamic options -->
  </div>

  <!-- Score input -->
  <div class="section-title">
    <span>🎯 Rate each option (0–10)</span>
  </div>
  <div id="scoreInputContainer" class="score-row">
    <!-- dynamic score fields -->
  </div>

  <hr />

  <div class="action-bar">
    <button class="btn" id="calculateBtn">📊 Calculate ranking</button>
    <button class="btn btn-outline" id="resetBtn">🔄 Reset demo</button>
  </div>

  <!-- Result panel -->
  <div class="result-panel" id="resultPanel">
    <div class="result-title">🏆 Decision ranking</div>
    <div id="rankingList" class="rank-list">
      <div class="empty-msg">Add options and calculate</div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- STATE ----------
    let options = [];  // [{ id, name, weight }]

    // ---------- DOM elements ----------
    const optionsContainer = document.getElementById('optionsContainer');
    const scoreInputContainer = document.getElementById('scoreInputContainer');
    const newOptionName = document.getElementById('newOptionName');
    const newOptionWeight = document.getElementById('newOptionWeight');
    const addOptionBtn = document.getElementById('addOptionBtn');
    const calculateBtn = document.getElementById('calculateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const rankingList = document.getElementById('rankingList');

    // ---------- Helper: generate unique id ----------
    function generateId() {
      return Date.now() + '-' + Math.random().toString(36).substr(2, 9);
    }

    // ---------- Render option list (weights) ----------
    function renderOptionList() {
      if (!optionsContainer) return;
      if (options.length === 0) {
        optionsContainer.innerHTML = `<div class="empty-msg" style="grid-column:1/-1;">No options yet. Add one above ⬆️</div>`;
        return;
      }
      let html = '';
      options.forEach((opt, index) => {
        html += `
          <div class="option-item" data-option-id="${opt.id}">
            <input type="text" class="option-name-input" value="${escapeHtml(opt.name)}" placeholder="Option name" data-id="${opt.id}" />
            <span style="color:#475569; font-weight:500; font-size:0.8rem;">⚖️</span>
            <input type="number" class="weight-input" min="1" max="10" step="0.5" value="${opt.weight}" data-id="${opt.id}" />
            <button class="remove-btn" data-id="${opt.id}" aria-label="Remove">✕</button>
          </div>
        `;
      });
      optionsContainer.innerHTML = html;

      // Attach event listeners for dynamic inputs inside option list
      document.querySelectorAll('.option-name-input').forEach(input => {
        input.addEventListener('change', function(e) {
          const id = this.dataset.id;
          const newName = this.value.trim() || 'Unnamed';
          const opt = options.find(o => o.id === id);
          if (opt) {
            opt.name = newName;
            // update score input label dynamically
            renderScoreInputs();
          }
        });
      });

      document.querySelectorAll('.weight-input').forEach(input => {
        input.addEventListener('change', function(e) {
          const id = this.dataset.id;
          let newWeight = parseFloat(this.value);
          if (isNaN(newWeight)) newWeight = 1;
          newWeight = Math.min(10, Math.max(1, newWeight));
          this.value = newWeight; // enforce bounds
          const opt = options.find(o => o.id === id);
          if (opt) {
            opt.weight = newWeight;
          }
        });
      });

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = this.dataset.id;
          options = options.filter(o => o.id !== id);
          renderOptionList();
          renderScoreInputs();
        });
      });
    }

    // ---------- Render score inputs for each option ----------
    function renderScoreInputs() {
      if (!scoreInputContainer) return;
      if (options.length === 0) {
        scoreInputContainer.innerHTML = `<div class="empty-msg" style="width:100%;">Add options to rate them</div>`;
        return;
      }
      let html = '';
      options.forEach(opt => {
        html += `
          <div class="score-box">
            <span style="font-weight:600; color:#1e293b;">🎯 ${escapeHtml(opt.name)}</span>
            <input type="number" class="score-input" min="0" max="10" step="0.5" placeholder="0-10" data-id="${opt.id}" value="7" />
          </div>
        `;
      });
      scoreInputContainer.innerHTML = html;

      // attach listeners to clamp
      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('change', function() {
          let val = parseFloat(this.value);
          if (isNaN(val)) val = 0;
          val = Math.min(10, Math.max(0, val));
          this.value = val;
        });
      });
    }

    // ---------- escape html for safe injection ----------
    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });
    }

    // ---------- Calculate and display ranking ----------
    function calculateRanking() {
      if (options.length === 0) {
        rankingList.innerHTML = `<div class="empty-msg">No options to rank</div>`;
        return;
      }

      // Gather score inputs from DOM
      const scoreMap = new Map(); // id -> numeric score
      document.querySelectorAll('.score-input').forEach(input => {
        const id = input.dataset.id;
        let score = parseFloat(input.value);
        if (isNaN(score)) score = 0;
        score = Math.min(10, Math.max(0, score));
        scoreMap.set(id, score);
      });

      // Build ranking array
      const ranked = options.map(opt => {
        const score = scoreMap.has(opt.id) ? scoreMap.get(opt.id) : 0;
        const weight = opt.weight || 1;
        const weightedScore = score * weight;
        return {
          id: opt.id,
          name: opt.name || 'Unnamed',
          weight: weight,
          score: score,
          weightedScore: weightedScore
        };
      });

      // Sort descending by weightedScore
      ranked.sort((a, b) => b.weightedScore - a.weightedScore);

      // Render ranking list
      if (ranked.length === 0) {
        rankingList.innerHTML = `<div class="empty-msg">No data</div>`;
        return;
      }

      let rankHtml = '';
      ranked.forEach((item, index) => {
        const medal = index === 0 ? '🥇' : (index === 1 ? '🥈' : (index === 2 ? '🥉' : `#${index+1}`));
        rankHtml += `
          <div class="rank-item">
            <span class="rank-name">${medal} ${escapeHtml(item.name)} <span style="opacity:0.7; font-size:0.8rem;">(w:${item.weight})</span></span>
            <span class="rank-score">${item.weightedScore.toFixed(1)}</span>
            <span class="rank-badge">${item.score.toFixed(1)} × ${item.weight}</span>
          </div>
        `;
      });
      rankingList.innerHTML = rankHtml;
    }

    // ---------- Add new option ----------
    function addOption() {
      const nameInput = newOptionName.value.trim();
      const weightVal = parseFloat(newOptionWeight.value);
      const name = nameInput || 'Option ' + (options.length + 1);
      let weight = isNaN(weightVal) ? 5 : weightVal;
      weight = Math.min(10, Math.max(1, weight));
      
      const newOpt = {
        id: generateId(),
        name: name,
        weight: weight
      };
      options.push(newOpt);
      
      // Clear input for next
      newOptionName.value = '';
      newOptionWeight.value = '5';
      
      renderOptionList();
      renderScoreInputs();
      // reset ranking area
      rankingList.innerHTML = `<div class="empty-msg">Options updated. Press calculate.</div>`;
    }

    // ---------- Reset to demo data ----------
    function resetDemo() {
      options = [
        { id: 'demo1', name: 'Kyoto', weight: 8 },
        { id: 'demo2', name: 'Lisbon', weight: 7 },
        { id: 'demo3', name: 'Bali', weight: 6 }
      ];
      newOptionName.value = '';
      newOptionWeight.value = '5';
      renderOptionList();
      renderScoreInputs();
      // set some sample scores (after rendering)
      requestAnimationFrame(() => {
        const scoreInputs = document.querySelectorAll('.score-input');
        if (scoreInputs.length >= 3) {
          scoreInputs[0].value = '9';
          scoreInputs[1].value = '8';
          scoreInputs[2].value = '7';
        }
      });
      rankingList.innerHTML = `<div class="empty-msg">Demo loaded. Calculate to rank.</div>`;
    }

    // ---------- Event listeners ----------
    addOptionBtn.addEventListener('click', addOption);
    calculateBtn.addEventListener('click', calculateRanking);
    resetBtn.addEventListener('click', resetDemo);

    // Allow Enter key on name field to add option
    newOptionName.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addOption();
      }
    });

    // ---------- Initial load with demo data ----------
    resetDemo();
  })();
</script>
</body>
</html>
