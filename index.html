<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#24150f" />
  <title>soYam cosmo — Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ----- RESET & VARIABLES ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-warm: #F8F5F0;
      --bg-card: #FFFFFF;
      --bg-slate: #F4F6F8;
      --bg-mocha: #1A0F08;
      --ink: #251a15;
      --muted: #766b64;
      --gold: #C7A45A;
      --gold-light: #EADFCA;
      --chocolate: #2B1A13;
      --chocolate2: #45271b;
      --olive: #1F2A1E;
      --emerald: #198754;
      --ruby: #A62B35;
      --amber: #b98214;
      --line: #eadfd5;
      --shadow: 0 10px 30px rgba(50, 30, 20, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: var(--bg-warm);
      color: var(--ink);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      margin: 0;
    }
    button {
      cursor: pointer;
      border: 0;
      font: inherit;
    }
    input, select, textarea {
      font: inherit;
    }
    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 80px;
      position: relative;
    }
    .hidden {
      display: none !important;
    }

    /* ----- HEADER / HERO (shared) ----- */
    .hero {
      background: linear-gradient(135deg, #24150f, #51301f);
      color: #fff;
      padding: 22px 20px 20px;
      text-align: center;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .logo {
      width: 72px;
      height: 72px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 6px;
      color: var(--gold);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 700;
      position: relative;
    }
    .logo::before {
      content: "✦";
      position: absolute;
      top: -8px;
      left: -8px;
      font-size: 14px;
      color: var(--gold-light);
      animation: glowPulse 2s infinite;
    }
    .logo::after {
      content: "✦";
      position: absolute;
      bottom: -8px;
      right: -8px;
      font-size: 14px;
      color: var(--gold-light);
      animation: glowPulse 2s infinite 0.5s;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .brand {
      font: 700 28px/1.2 var(--font-serif);
      letter-spacing: 0.15em;
    }
    .brand .gold {
      color: var(--gold);
    }
    .amharic {
      font-size: 16px;
      margin-top: 4px;
      color: var(--gold-light);
    }
    .tagline {
      color: #eadfca;
      margin: 6px auto 8px;
      max-width: 620px;
      font-size: 13px;
      opacity: 0.9;
    }
    .address {
      font-size: 12px;
      color: #e9ded5;
      line-height: 1.6;
    }
    .address a {
      color: var(--gold-light);
      text-decoration: none;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.3);
    }
    .contact-strip {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .contact-strip a {
      background: rgba(255, 255, 255, 0.08);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: #fff;
      text-decoration: none;
      border: 1px solid #765542;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }
    .contact-strip a:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--gold);
    }
    .contact-strip a i {
      color: var(--gold);
    }

    /* ----- LANGUAGE / CURRENCY BAR ----- */
    .lang-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .lang-bar::-webkit-scrollbar { display: none; }
    .lang-bar button {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 12px;
      white-space: nowrap;
      font-size: 12px;
      color: var(--ink);
      transition: 0.2s;
    }
    .lang-bar button.active {
      background: var(--chocolate);
      color: #fff;
      border-color: var(--chocolate);
    }
    .lang-bar .currency {
      margin-left: auto;
      font-weight: 600;
      color: var(--chocolate);
      background: var(--gold-light);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
    }

    /* ----- MAIN CONTENT ----- */
    main {
      padding: 16px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0 14px;
    }
    .section-title h2 {
      margin: 0;
      font: 700 20px/1.2 var(--font-serif);
      color: var(--chocolate);
    }
    .section-title .badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--gold-light);
      color: var(--chocolate);
      padding: 3px 12px;
      border-radius: 999px;
    }

    /* ----- CARDS ----- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card.dark {
      background: var(--chocolate);
      border-color: var(--chocolate2);
      color: #fff;
    }
    .card.dark .muted {
      color: #ccc;
    }

    /* ----- METRIC GRID ----- */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      background: #f8f3ed;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 12px;
    }
    .metric small {
      font-size: 11px;
      color: var(--muted);
      display: block;
      font-weight: 500;
    }
    .metric strong {
      display: block;
      font-size: 22px;
      font-weight: 700;
      margin-top: 2px;
      color: var(--chocolate);
    }
    .metric .trend {
      font-size: 12px;
      font-weight: 600;
      margin-top: 2px;
    }
    .metric .trend.up { color: var(--emerald); }
    .metric .trend.down { color: var(--ruby); }

    /* ----- BUTTONS & ACTIONS ----- */
    .actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 10px;
    }
    .btn {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--chocolate);
      color: #fff;
      font-weight: 600;
      text-align: center;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn.gold { background: var(--gold); color: #fff; }
    .btn.green { background: var(--emerald); }
    .btn.ruby { background: var(--ruby); }
    .btn.outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn.small { padding: 8px 12px; font-size: 12px; }
    .btn-block { width: 100%; }

    /* ----- TABS (category) ----- */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      white-space: nowrap;
      padding: 6px 16px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 13px;
      transition: 0.2s;
    }
    .tabs button.active {
      background: var(--chocolate);
      color: #fff;
      border-color: var(--chocolate);
    }

    /* ----- PRODUCT GRID ----- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .product {
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .product:hover { transform: translateY(-2px); }
    .product-img {
      height: 120px;
      background: linear-gradient(145deg, #efe4d8, #fff);
      display: grid;
      place-items: center;
      font-size: 44px;
    }
    .product-body {
      padding: 12px;
    }
    .product h3 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 700;
    }
    .product .meta {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .product .price {
      font-weight: 700;
      font-size: 15px;
      color: var(--chocolate);
    }
    .product .add {
      background: var(--chocolate);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      width: 100%;
      margin-top: 6px;
    }

    /* ----- LIST ITEMS ----- */
    .list {
      display: grid;
      gap: 10px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fcfaf8;
    }
    .list-item .info { flex: 1; }
    .list-item .info strong { display: block; font-size: 14px; }
    .list-item .info small { color: var(--muted); font-size: 12px; }

    /* ----- BADGES ----- */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    .badge.green { background: #e5f6ed; color: var(--emerald); }
    .badge.amber { background: #fff2d2; color: var(--amber); }
    .badge.ruby { background: #fde8ea; color: var(--ruby); }
    .badge.gold { background: #fcf6ea; color: var(--gold); }

    /* ----- LOYALTY WIDGET ----- */
    .loyalty {
      background: linear-gradient(135deg, #2b1a13, #4a2d1f);
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .loyalty .status {
      font-weight: 600;
      font-size: 14px;
    }
    .loyalty .status i { color: var(--gold); margin-right: 6px; }
    .loyalty .points {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
    }
    .loyalty .points strong { color: var(--gold); }

    /* ----- FULFILLMENT TOGGLE ----- */
    .fulfill-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 10px 0 14px;
    }
    .fulfill-opt {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      font-weight: 500;
      transition: 0.2s;
    }
    .fulfill-opt.active {
      border-color: var(--gold);
      background: #fcf6ea;
    }
    .fulfill-opt i { display: block; font-size: 24px; margin-bottom: 4px; color: var(--gold); }

    /* ----- BOTTOM NAV ----- */
    .bottom-nav {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(1100px, 100%);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-around;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .bottom-nav button {
      background: none;
      color: var(--muted);
      font-size: 10px;
      padding: 4px 6px;
      border-radius: 12px;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      flex: 1;
      max-width: 80px;
    }
    .bottom-nav button i { font-size: 20px; }
    .bottom-nav button.sel { color: var(--chocolate); font-weight: 600; }
    .bottom-nav button .badge-dot {
      background: var(--ruby);
      color: #fff;
      border-radius: 50%;
      padding: 0 5px;
      font-size: 9px;
      line-height: 16px;
      min-width: 16px;
      text-align: center;
      margin-left: 4px;
    }

    /* ----- SCANNER OVERLAY (demo) ----- */
    .scanner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }
    .scanner-overlay.active { display: flex; }
    .scanner-box {
      width: 220px;
      height: 220px;
      border: 3px solid var(--gold);
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      position: relative;
      animation: pulse 1.6s infinite;
    }
    .scanner-box i { font-size: 64px; color: var(--gold); opacity: 0.6; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 20px rgba(199,164,90,0.2); } 50% { box-shadow: 0 0 60px rgba(199,164,90,0.4); } }
    .scanner-close {
      margin-top: 30px;
      padding: 10px 30px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid #765542;
    }

    /* ----- EOD PANEL ----- */
    .eod-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    .eod-row:last-child { border-bottom: 0; }
    .eod-row .label { color: var(--muted); }
    .eod-row .value { font-weight: 600; }
    .eod-row .value.gold { color: var(--gold); }
    .eod-row .value.green { color: var(--emerald); }

    /* ----- AI INSIGHTS ----- */
    .insight-chip {
      display: inline-block;
      background: #f0ebe5;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      margin: 4px 6px 4px 0;
      border: 1px solid var(--line);
    }
    .insight-chip i { margin-right: 6px; color: var(--gold); }

    /* ----- TABLE (inventory) ----- */
    .table-wrap { overflow-x: auto; }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table th, .table td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    .table th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }

    /* ----- STAFF LIST ----- */
    .staff-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .staff-item:last-child { border-bottom: 0; }

    /* ----- RESPONSIVE ----- */
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
      .metric-grid { grid-template-columns: repeat(4, 1fr); }
      main { padding: 22px 30px; }
      .actions { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      .brand { font-size: 22px; }
      .logo { width: 60px; height: 60px; font-size: 24px; }
      .grid { gap: 10px; }
      .product-img { height: 100px; }
    }

    /* ----- TOAST ----- */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--chocolate);
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 200;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      animation: fadeUp 0.3s ease;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    @keyframes fadeUp { 0% { opacity:0; transform: translateX(-50%) translateY(12px); } 100% { opacity:1; transform: translateX(-50%) translateY(0); } }

    /* Portal selector (multi-role) */
    .portal-screen {
      min-height: 100vh;
      background: linear-gradient(135deg, #24150f, #51301f);
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .portal-screen .logo { width: 80px; height: 80px; font-size: 32px; }
    .portal-screen h1 { font-family: var(--font-serif); margin: 16px 0 8px; }
    .portal-card {
      background: #fff;
      color: var(--ink);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-top: 20px;
    }
    .portal-choice {
      display: block;
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 16px;
      margin: 8px 0;
      transition: 0.2s;
      cursor: pointer;
    }
    .portal-choice:hover { border-color: var(--gold); background: #fcf9f5; }
    .portal-choice strong { display: block; font-size: 16px; }
    .portal-choice span { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // ================================================================
    // DATA STORE (static for prototype)
    // ================================================================
    const STORE = {
      name: "soYam cosmo",
      am: "ሶያም ኮስሞቲክስ",
      owner: "Rahel Mulatu",
      address: "Betel Building, Ground Floor, Addis Ababa, Ethiopia",
      phone: "+251919096451",
      maps: "https://maps.app.goo.gl/FMJMrTvD2wDPGJUv8",

      products: [
        { id: 1, name: "Luxury Face Cream", cat: "Skincare", price: 850, stock: 24, icon: "🧴" },
        { id: 2, name: "Vitamin C Serum", cat: "Skincare", price: 1200, stock: 18, icon: "✨" },
        { id: 3, name: "Body Lotion", cat: "Skincare", price: 650, stock: 42, icon: "🧴" },
        { id: 4, name: "Beauty Fragrance", cat: "Fragrance", price: 1450, stock: 11, icon: "🌸" },
        { id: 5, name: "Hair Care Oil", cat: "Haircare", price: 700, stock: 27, icon: "💧" },
        { id: 6, name: "Liquid Detergent", cat: "Detergent", price: 390, stock: 65, icon: "🫧" },
        { id: 7, name: "Laundry Soap", cat: "Detergent", price: 250, stock: 53, icon: "🧼" },
        { id: 8, name: "Makeup Set", cat: "Makeup", price: 1850, stock: 8, icon: "💄" }
      ],

      orders: [
        { id: "#1024", customer: "Amanuel K.", total: 2850, status: "PAYMENT_PENDING", date: "Today" },
        { id: "#1023", customer: "Selam T.", total: 1450, status: "DELIVERY", date: "Today" },
        { id: "#1022", customer: "Dawit M.", total: 850, status: "OWNER_PENDING", date: "Yesterday" },
        { id: "#1021", customer: "Hana W.", total: 2450, status: "DELIVERY", date: "Yesterday" }
      ],

      staff: [
        { name: "Hewot M.", handle: "@hewot_m", role: "Sales Associate", active: true, revenue: 58400 },
        { name: "Alemu K.", handle: "@alemu_k", role: "Driver", active: true },
        { name: "Bereket H.", handle: "@bere_h", role: "Sales Associate", active: true },
        { name: "Sami A.", handle: "@sami_a", role: "Sales Associate", active: false }
      ],

      // For demo metrics
      metrics: {
        revenue: 284750,
        stockCapital: 142300,
        grossProfit: 68200,
        profitMargin: 23.6,
        cac: 6.8,
        aov: 560,
        cagr: 7.1,
        ordersToday: 28,
        revenueToday: 42300,
        avgFulfillment: 32,
        customerRating: 4.8,
        outForDelivery: 6,
        pendingOrders: 12,
        inStorePicks: 14,
        deliveries: 8,
        lowStock: 2
      }
    };

    // ================================================================
    // APPLICATION STATE
    // ================================================================
    let state = {
      portal: null,       // 'customer' | 'staff' | 'owner' | 'driver'
      tab: 'home',
      category: 'All',
      cart: [],
      lang: 'English',
      fulfillment: 'pickup', // 'pickup' or 'delivery'
      orders: [...STORE.orders],
      products: [...STORE.products],
      staff: [...STORE.staff],
      user: null,
      roles: [],
      loyaltyPoints: 2450
    };

    // ================================================================
    // TELEGRAM INTEGRATION (simulated)
    // ================================================================
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    function getTelegramUser() {
      const u = tg?.initDataUnsafe?.user;
      if (u) return u;
      return { id: "demo-buyer", first_name: "Telegram", last_name: "User", username: "demo" };
    }

    // Simulate role resolution
    function resolveRoles() {
      const u = getTelegramUser();
      state.user = u;

      const ownerIds = window.SOYAM_OWNER_IDS || ['123456']; // add your test id

    function money(n) { return n.toLocaleString() + ' Br'; }
    function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m])); }

    let toastTimeout;
    function toast(msg) {
      const old = document.querySelector('.toast');
      if (old) old.remove();
      const d = document.createElement('div');
      d.className = 'toast';
      d.textContent = msg;
      document.body.appendChild(d);
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => d.remove(), 2200);
    }

    // ================================================================
    // RENDER ENGINE
    // ================================================================
    function render() {
      state.roles = resolveRoles();
      if (!state.portal) {
        // If only customer, go directly
        if (state.roles.length === 1 && state.roles[0] === 'CUSTOMER') {
          state.portal = 'customer';
        } else if (state.roles.includes('OWNER')) {
          return renderPortalSelector();
        } else {
          state.portal = state.roles[0]?.toLowerCase() || 'customer';
        }
      }
      // Ensure portal is allowed
      if (!state.roles.includes(state.portal.toUpperCase()) && state.portal !== 'customer') {
        state.portal = 'customer';
      }
      switch (state.portal) {
        case 'owner': renderOwner(); break;
        case 'staff': renderStaff(); break;
        case 'driver': renderDriver(); break;
        default: renderCustomer();
      }
    }

        state.portal = state.roles[next].toLowerCase();

        <div class="app">
          <header class="hero"><div class="brand">➕ Add Stock Item</div></header>
          <main>
            <div class="card">
              <label style="font-size:12px; color:var(--muted);">Category</label>
              <select id="catSelect" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;">
                ${['Skincare','Makeup','Fragrance','Haircare','Detergent','Cosmetics & Beauty'].map(c => `<option>${c}</option>`).join('')}
              </select>
              <label style="font-size:12px; color:var(--muted);">Product Name</label>
              <input id="prodName" placeholder="Name" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;" />
              <label style="font-size:12px; color:var(--muted);">Buying Price (Br)</label>
              <input id="prodCost" type="number" placeholder="0" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;" />
              <label style="font-size:12px; color:var(--muted);">Quantity</label>
              <input id="prodQty" type="number" placeholder="0" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;" />
              <div class="actions" style="grid-template-columns:1fr 1fr;">
                <button class="btn green" onclick="saveStock()">💾 Save</button>
                <button class="btn outline" onclick="render()">Cancel</button>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    function saveStock() {
      const name = document.getElementById('prodName').value.trim();
      const cat = document.getElementById('catSelect').value;
      const cost = Number(document.getElementById('prodCost').value);
      const qty = Number(document.getElementById('prodQty').value);
      if (!name || !qty) return toast('Name and quantity required');
      state.products.push({ id: Date.now(), name, cat, price: cost || 0, stock: qty, icon: '📦' });
      toast('Stock added');
      render();
    }

    function ownerStaff() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero"><div class="brand">👥 Staff Management</div></header>
          <main>
            <div class="card">
              <button class="btn small" onclick="addStaffForm()">+ Add Staff</button>
              <div class="list" style="margin-top:12px;">
                ${state.staff.map(s => `
                  <div class="list-item">
                    <div class="info"><strong>${s.name}</strong><small>${s.handle} · ${s.role}</small></div>
                    <div>
                      <span class="badge ${s.active?'green':'ruby'}">${s.active?'Active':'Suspended'}</span>
                      <button class="btn small ruby" style="padding:4px 8px;" onclick="toggleStaff('${s.handle}')">${s.active?'Suspend':'Activate'}</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <button class="btn outline" onclick="render()">← Dashboard</button>
          </main>
        </div>
      `;
    }

    function toggleStaff(handle) {
      const s = state.staff.find(x => x.handle === handle);
      if (s) { s.active = !s.active; toast(`${s.name} ${s.active?'activated':'suspended'}`); ownerStaff(); }
    }

    function addStaffForm() {
      const name = prompt('Full name');
      if (!name) return;
      const handle = prompt('Telegram handle (e.g. @username)');
      if (!handle) return;
      state.staff.push({ name, handle, role: 'Sales Associate', active: true, revenue: 0 });
      toast('Staff added');
      ownerStaff();
    }

    function closeDay() {
      if (confirm('Close and lock today\'s transactions?')) {
        toast('🔒 Daily ledger closed (demo)');
      }
    }

    // ================================================================
    // DRIVER PORTAL
    // ================================================================
    function renderDriver() {
      document.getElementById('app').innerHTML = `
        <div class="app">
          <header class="hero">
            <div class="logo">SY</div>
            <div class="brand">🚚 Logistics Dispatch</div>
            <div class="address">${STORE.address}</div>
          </header>
          <main>
            <div class="section-title">
              <h2>Assigned Deliveries</h2>
              <span class="badge" style="background:var(--emerald); color:#fff;">🟢 ONLINE</span>
            </div>
            <div class="card">
              <div class="list-item">
                <div class="info"><strong>Order #1023</strong><small>Drop‑off: Addis Ababa · Contact protected</small></div>
                <span class="badge amber">ASSIGNED</span>
              </div>
              <div class="actions" style="margin-top:12px;">
                <button class="btn outline small" onclick="toast('📍 Navigate')"><i class="fas fa-map"></i> Navigate</button>
                <button class="btn green small" onclick="toast('✅ Delivery marked done')">Mark Delivered</button>
              </div>
            </div>
          </main>
          ${bottomNav('driver')}
        </div>
      `;
    }

    // ================================================================
    // SCANNER OVERLAY
    // ================================================================
    function openScanner() {
      document.getElementById('scannerOverlay').classList.add('active');
      setTimeout(() => {
        closeScanner();
        toast('📸 Scanned: Product added to basket');
      }, 2500);
    }
    function closeScanner() {
      document.getElementById('scannerOverlay').classList.remove('active');
    }

    // ================================================================
    // HERO & BOTTOM NAV HELPERS
    // ================================================================
    function heroHTML() {
      return `
        <header class="hero">
          <div class="logo">SY</div>
          <div class="brand">soYam <span class="gold">cosmo</span></div>
          <div class="amharic">${STORE.am}</div>
          <div class="tagline">✦ Premium Beauty Essentials — Authentic cosmetics, detergents & beauty products. Shop with confidence.</div>
          <div class="address">📍 ${STORE.address} · <a href="${STORE.maps}" target="_blank">Google Maps</a></div>
          <div class="contact-strip">
            <a href="https://t.me/rahm34" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
            <a href="tel:${STORE.phone}"><i class="fas fa-phone"></i> Call</a>
            <a href="https://wa.me/${STORE.phone.replace('+','')}" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
          </div>
        </header>
      `;
    }

    function bottomNav(activePortal) {
      const isCustomer = activePortal === 'customer';
      const isStaff = activePortal === 'staff';
      const isOwner = activePortal === 'owner';
      const isDriver = activePortal === 'driver';
      const cartCount = state.cart.reduce((a, x) => a + x.qty, 0);

      let tabs = [];
      if (isCustomer) {
        tabs = [
          { id: 'home', icon: 'fa-home', label: 'Home' },
          { id: 'orders', icon: 'fa-clipboard-list', label: 'Orders' },
          { id: 'cart', icon: 'fa-shopping-bag', label: 'Cart', badge: cartCount || '' },
          { id: 'loyalty', icon: 'fa-star', label: 'Loyalty' }
        ];
      } else if (isStaff) {
        tabs = [
          { id: 'home', icon: 'fa-home', label: 'Dashboard' },
          { id: 'orders', icon: 'fa-clipboard-list', label: 'Orders' },
          { id: 'scan', icon: 'fa-qrcode', label: 'Scan' }
        ];
      } else if (isOwner) {
        tabs = [
          { id: 'home', icon: 'fa-home', label: 'Dashboard' },
          { id: 'inventory', icon: 'fa-boxes', label: 'Stock' },
          { id: 'staff', icon: 'fa-users', label: 'Staff' },
          { id: 'orders', icon: 'fa-clipboard-list', label: 'Orders' }
        ];
      } else if (isDriver) {
        tabs = [
          { id: 'home', icon: 'fa-home', label: 'Route' },
          { id: 'deliveries', icon: 'fa-truck', label: 'Deliveries' }
        ];
      }

      const actionMap = {
        'home': () => { state.tab = 'home'; render(); },
        'orders': () => { state.tab = 'orders'; render(); },
        'cart': () => { state.tab = 'cart'; render(); },
        'loyalty': () => { state.tab = 'loyalty'; render(); },
        'scan': () => openScanner(),
        'inventory': () => ownerInventory(),
        'staff': () => ownerStaff(),
        'deliveries': () => toast('📦 Deliveries list')
      };

      return `
        <nav class="bottom-nav">
          ${tabs.map(t => {
            const isActive = state.tab === t.id || (t.id === 'home' && !state.tab);
            const badgeHtml = t.badge ? `<span class="badge-dot">${t.badge}</span>` : '';
            return `<button class="${isActive?'sel':''}" onclick="(${actionMap[t.id]||(()=>toast('Coming soon'))})()">
              <i class="fas ${t.icon}"></i> ${t.label} ${badgeHtml}
            </button>`;
          }).join('')}
          <button onclick="toast('💬 Contact support')"><i class="fas fa-headset"></i> Contact</button>
        </nav>
      `;
    }

    // ================================================================
    // INIT
    // ================================================================
    // Add scanner overlay to body
    const overlay = document.createElement('div');
    overlay.className = 'scanner-overlay';
    overlay.id = 'scannerOverlay';
    overlay.innerHTML = `
      <div class="scanner-box"><i class="fas fa-camera"></i></div>
      <p style="color:#fff; margin-top:16px;">Scanning barcode / QR...</p>
      <button class="scanner-close" onclick="closeScanner()">Cancel</button>
    `;
    document.body.appendChild(overlay);

    // Start
    render();

    // Simulate role for demo: if URL contains ?role=owner, set owner id
    const params = new URLSearchParams(window.location.search);
    if (params.get('role') === 'owner') {
      // Override user id to simulate owner
      if (tg) {
        tg.initDataUnsafe.user.id = '123456';
      } else {
        // fallback
        localStorage.setItem('demo_owner', 'true');
      }
      render();
    }

    console.log('🚀 soYam cosmo · Mini App ready');
  </script>
</body>
</html>
