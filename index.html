<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🔇 Sound Dominator · scan & control devices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 30% 20%, #0b1a2e, #02060d);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      margin: 0;
      color: #eaf0fa;
    }
    .app-shell {
      max-width: 750px;
      width: 100%;
      background: rgba(15, 25, 40, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      padding: 24px 20px 30px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .subtitle {
      font-size: 0.9rem;
      color: #9db4d0;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.05);
      display: inline-block;
      border-radius: 40px;
      padding: 6px 18px;
      font-weight: 400;
    }
    .scan-panel {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 30px;
      padding: 18px 18px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      justify-content: space-between;
    }
    .scan-btn {
      background: #1d4ed8;
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 16px rgba(29, 78, 216, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      border: 1px solid #ffffff40;
    }
    .scan-btn:hover {
      background: #2563eb;
      transform: scale(1.02);
    }
    .scan-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .status-badge {
      background: #0f1b2d;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #cbd5e1;
      font-weight: 500;
    }
    .device-list {
      margin: 18px 0 12px;
    }
    .device-card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 28px;
      padding: 16px 18px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(6px);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      justify-content: space-between;
      transition: 0.15s;
    }
    .device-card:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #3b5f8a;
    }
    .device-icon {
      font-size: 2.2rem;
      background: #0c1929;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 40px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5);
    }
    .device-info {
      flex: 2;
      min-width: 140px;
    }
    .device-name {
      font-weight: 700;
      font-size: 1.2rem;
      color: #f1f5f9;
    }
    .device-details {
      font-size: 0.8rem;
      color: #a3b8d4;
      margin-top: 4px;
    }
    .device-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-small {
      background: #1f3a5f;
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.1s;
      border: 1px solid #ffffff30;
      font-size: 0.85rem;
    }
    .btn-small:hover {
      background: #2c4f7a;
    }
    .btn-mute {
      background: #b91c1c;
    }
    .btn-mute:hover {
      background: #dc2626;
    }
    .btn-off {
      background: #4b5563;
    }
    .btn-off:hover {
      background: #6b7280;
    }
    .volume-slider {
      width: 90px;
      accent-color: #facc15;
      cursor: pointer;
    }
    .muted-indicator {
      background: #ef4444;
      color: white;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      text-transform: uppercase;
    }
    .empty-msg {
      color: #7c8fa5;
      text-align: center;
      padding: 24px;
      font-style: italic;
    }
    .control-summary {
      background: #0c1a2e;
      border-radius: 24px;
      padding: 14px 16px;
      margin: 16px 0 8px;
      border: 1px solid #2c405b;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }
    .btn-kill-all {
      background: #7f1d1d;
      border: none;
      color: white;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #ef4444a0;
      box-shadow: 0 6px 18px rgba(185, 28, 28, 0.5);
      letter-spacing: 0.5px;
    }
    .btn-kill-all:hover {
      background: #b91c1c;
    }
    .btn-restore {
      background: #14532d;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 40px;
      cursor: pointer;
      border: 1px solid #4ade80a0;
    }
    hr {
      border: 0.5px solid #253b55;
      margin: 18px 0 6px;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <h1>🔇 Sound Dominator</h1>
  <div class="subtitle">📡 auto‑scan nearby speakers · TV · devices</div>

  <!-- Scan panel -->
  <div class="scan-panel">
    <button class="scan-btn" id="scanBtn">📡 SCAN FOR DEVICES</button>
    <span class="status-badge" id="scanStatus">idle — tap scan</span>
  </div>

  <!-- Device list -->
  <div class="device-list" id="deviceListContainer">
    <div class="empty-msg">No devices scanned. Press "SCAN" to discover nearby electronics.</div>
  </div>

  <!-- Global controls -->
  <div class="control-summary" id="globalControlPanel" style="display:none;">
    <span style="font-weight:600; color:#b7c9e0;">🎛️ Global action:</span>
    <button class="btn-kill-all" id="killAllBtn">🔇 MUTE ALL</button>
    <button class="btn-restore" id="restoreAllBtn">🔊 RESTORE ALL</button>
  </div>

  <hr />
  <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
    <button class="btn-small" id="rescanBtn" style="background:#334155;">🔄 Rescan (refresh)</button>
  </div>
</div>

<script>
  (function() {
    // ---------- Simulated device database ----------
    const DEVICE_POOL = [
      { id: 'dev1', name: 'Living Room TV', type: 'TV', icon: '📺', defaultVolume: 45, isOn: true, isMuted: false },
      { id: 'dev2', name: 'Kitchen Echo Dot', type: 'Smart Speaker', icon: '🔊', defaultVolume: 60, isOn: true, isMuted: false },
      { id: 'dev3', name: 'Bose Soundbar', type: 'Soundbar', icon: '🎵', defaultVolume: 55, isOn: true, isMuted: false },
      { id: 'dev4', name: 'Bedroom HomePod', type: 'Smart Speaker', icon: '🍎', defaultVolume: 50, isOn: true, isMuted: false },
      { id: 'dev5', name: 'Sony Bluetooth Speaker', type: 'Portable Speaker', icon: '🔉', defaultVolume: 70, isOn: true, isMuted: false },
      { id: 'dev6', name: 'Office Google Nest', type: 'Smart Display', icon: '🖥️', defaultVolume: 40, isOn: true, isMuted: false },
      { id: 'dev7', name: 'Garage Radio', type: 'Radio', icon: '📻', defaultVolume: 65, isOn: true, isMuted: false },
    ];

    // State: devices currently discovered
    let discoveredDevices = [];
    let scanInProgress = false;

    // DOM elements
    const scanBtn = document.getElementById('scanBtn');
    const scanStatus = document.getElementById('scanStatus');
    const deviceListContainer = document.getElementById('deviceListContainer');
    const globalControlPanel = document.getElementById('globalControlPanel');
    const killAllBtn = document.getElementById('killAllBtn');
    const restoreAllBtn = document.getElementById('restoreAllBtn');
    const rescanBtn = document.getElementById('rescanBtn');

    // ---------- Helpers ----------
    function generateId() {
      return Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    }

    // Simulate network/device discovery (random subset)
    function performScan() {
      if (scanInProgress) return;
      scanInProgress = true;
      scanBtn.disabled = true;
      scanStatus.textContent = '📡 scanning ... detecting RF, Bluetooth, Wi‑Fi, HDMI-CEC ...';
      
      // Simulate asynchronous discovery
      setTimeout(() => {
        // Randomly pick 3-7 devices from pool, ensure unique
        const shuffled = [...DEVICE_POOL].sort(() => 0.5 - Math.random());
        const count = Math.floor(Math.random() * 5) + 3; // 3-7 devices
        const selected = shuffled.slice(0, count);
        
        // Clone with fresh ids and states
        discoveredDevices = selected.map(dev => ({
          ...dev,
          id: 'scan_' + generateId(),
          originalId: dev.id,
          isOn: true,
          isMuted: false,
          volume: dev.defaultVolume,
        }));
        
        scanInProgress = false;
        scanBtn.disabled = false;
        scanStatus.textContent = `✅ found ${discoveredDevices.length} devices`;
        renderDeviceList();
        globalControlPanel.style.display = 'flex';
      }, 800);
    }

    // Render devices into container
    function renderDeviceList() {
      if (!deviceListContainer) return;
      if (discoveredDevices.length === 0) {
        deviceListContainer.innerHTML = `<div class="empty-msg">No devices found. Try scanning again.</div>`;
        return;
      }

      let html = '';
      discoveredDevices.forEach(dev => {
        const muteStatus = dev.isMuted ? '<span class="muted-indicator">MUTED</span>' : '';
        const powerStatus = dev.isOn ? '🟢 on' : '🔴 off';
        html += `
          <div class="device-card" data-device-id="${dev.id}">
            <div class="device-icon">${dev.icon}</div>
            <div class="device-info">
              <div class="device-name">${dev.name} ${muteStatus}</div>
              <div class="device-details">${dev.type} · ${powerStatus} · volume ${dev.volume}%</div>
            </div>
            <div class="device-actions">
              <input type="range" min="0" max="100" value="${dev.volume}" class="volume-slider" data-id="${dev.id}" />
              <button class="btn-small btn-mute" data-id="${dev.id}" data-action="mute">${dev.isMuted ? '🔇 Unmute' : '🔇 Mute'}</button>
              <button class="btn-small btn-off" data-id="${dev.id}" data-action="off">${dev.isOn ? '⏻ Off' : '⏻ On'}</button>
            </div>
          </div>
        `;
      });
      deviceListContainer.innerHTML = html;

      // Attach event listeners for dynamic controls
      document.querySelectorAll('.volume-slider').forEach(slider => {
        slider.addEventListener('input', function(e) {
          const id = this.dataset.id;
          const dev = discoveredDevices.find(d => d.id === id);
          if (dev) {
            dev.volume = parseInt(this.value);
            dev.isOn = true; // moving slider implies on
            updateDeviceCard(id);
          }
        });
      });

      document.querySelectorAll('.btn-mute').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = this.dataset.id;
          const dev = discoveredDevices.find(d => d.id === id);
          if (dev) {
            dev.isMuted = !dev.isMuted;
            if (dev.isMuted) dev.isOn = true; // mute implies on but silent
            updateDeviceCard(id);
            renderDeviceList(); // re-render to update buttons
          }
        });
      });

      document.querySelectorAll('.btn-off').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const id = this.dataset.id;
          const dev = discoveredDevices.find(d => d.id === id);
          if (dev) {
            dev.isOn = !dev.isOn;
            if (!dev.isOn) dev.isMuted = false; // off means unmuted but silent
            updateDeviceCard(id);
            renderDeviceList();
          }
        });
      });
    }

    // Update a specific card (optional for live slider display without full re-render)
    function updateDeviceCard(id) {
      const dev = discoveredDevices.find(d => d.id === id);
      if (!dev) return;
      const card = document.querySelector(`.device-card[data-device-id="${id}"]`);
      if (card) {
        const details = card.querySelector('.device-details');
        const nameEl = card.querySelector('.device-name');
        if (details) {
          const powerStatus = dev.isOn ? '🟢 on' : '🔴 off';
          details.textContent = `${dev.type} · ${powerStatus} · volume ${dev.volume}%`;
        }
        if (nameEl) {
          nameEl.innerHTML = `${dev.name} ${dev.isMuted ? '<span class="muted-indicator">MUTED</span>' : ''}`;
        }
        const muteBtn = card.querySelector('.btn-mute');
        if (muteBtn) {
          muteBtn.textContent = dev.isMuted ? '🔇 Unmute' : '🔇 Mute';
        }
        const offBtn = card.querySelector('.btn-off');
        if (offBtn) {
          offBtn.textContent = dev.isOn ? '⏻ Off' : '⏻ On';
        }
      }
    }

    // Global mute all
    function muteAllDevices() {
      discoveredDevices.forEach(dev => {
        dev.isMuted = true;
        dev.isOn = true; // stay on but muted
      });
      renderDeviceList();
      scanStatus.textContent = `🔇 all ${discoveredDevices.length} devices muted`;
    }

    // Global restore (unmute + on)
    function restoreAllDevices() {
      discoveredDevices.forEach(dev => {
        dev.isMuted = false;
        dev.isOn = true;
        dev.volume = dev.defaultVolume || 50;
      });
      renderDeviceList();
      scanStatus.textContent = `🔊 all devices restored`;
    }

    // Rescan: clear and scan again
    function rescan() {
      discoveredDevices = [];
      renderDeviceList();
      globalControlPanel.style.display = 'none';
      scanStatus.textContent = '🔄 rescanning ...';
      performScan();
    }

    // ---------- Event listeners ----------
    scanBtn.addEventListener('click', performScan);
    killAllBtn.addEventListener('click', muteAllDevices);
    restoreAllBtn.addEventListener('click', restoreAllDevices);
    rescanBtn.addEventListener('click', rescan);

    // initial state
    scanStatus.textContent = 'idle — tap scan to discover nearby electronics';
    // Auto-trigger a scan on load after 1 second (like "app open automatically find devices")
    setTimeout(() => {
      performScan();
    }, 800);
  })();
</script>
</body>
</html>
